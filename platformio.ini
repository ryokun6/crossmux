[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.5.3

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
; missingInclude (project headers) is suppressed alongside missingIncludeSystem: on a
; fresh CI checkout cppcheck has no resolved include paths, so it reports every
; project header as missing (~400 information-level lines) and fails the job.
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=missingInclude --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DFREEINK_SSD1677_CONFIG=crossPointX4Ssd1677Config
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
# MEMFIX-PORT: single-precision ECC (sp_c32.c). Without it every P-256 operation
# (TLS 1.3 key_share keygen, ECDHE, ECDSA cert verify) runs on fast-math bignums
# that WOLFSSL_SMALL_STACK heap-allocates at FP_MAX_BITS size -- tens of KB of
# temporaries, which OOMs (MP_MEM) at the ~50KB free heap a reading session
# leaves. SP uses fixed 256-bit arrays: a few KB, and several times faster.
# SP_SMALL trades the large precomputed point tables for smaller flash.
  -DWOLFSSL_HAVE_SP_ECC
  -DWOLFSSL_HAVE_SP_RSA
  -DWOLFSSL_SP_SMALL
  -DWOLFSSL_SP_4096
  -DHAVE_MAX_FRAGMENT
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DHAVE_SNI
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity,--wrap=wolfSSL_UseSNI
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Source filter: by default exclude Chinese-only content. Environments that
; define ENABLE_CHINESE_VERSION must add it back via build_src_filter.
; Extra game apps are excluded from all builds (kept out of firmware).
build_src_filter =
  +<*>
  -<.git/>
  -<.svn/>
  -<activities/apps/2048/>
  -<activities/apps/avatar/>
  -<activities/apps/cellular/>
  -<activities/apps/chinese-chess/>
  -<activities/apps/gomoku/>
  -<activities/apps/minesweeper/>
  -<activities/apps/sudoku/>
  -<activities/apps/weread/>

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

; Hybrid custom_sdkconfig:
; - Upstream MEMFIX-PORT heap reclamation (~32-37 KB): timer stacks, WiFi IRAM
;   offload, selective Arduino compilation.
; - ryOS mbedTLS X3 buffer tuning for general HTTPS via esp_http_client while
;   WeRead uses wolfSSL (FREEINK_NET_WOLFSSL / SecureNet).
;
; If an interrupted rebuild fails with "multiple definition of 'app_main'"
; (stale generated scaffold), clean it up with:
;   rm -rf .dummy CMakeLists.txt sdkconfig.default sdkconfig.defaults .pio/build/default
; Do NOT use `git clean -fdX` — it deletes platformio.local.ini.
custom_sdkconfig =
  ; Task stack right-sizing from measured high-water marks (heap block map +
  ; per-task stack audit, July 2026): esp_timer used ~0.8 KB of 8 KB across
  ; every capture; the FreeRTOS timer service used ~0.5 KB
  ; of 4 KB. Neither runs TLS or app code. ~7 KB back to the heap.
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  ; Move the WiFi stack's non-critical hot paths out of IRAM into flash.
  ; On the C3, IRAM and DRAM share one SRAM pool, so the ~25-30 KB this
  ; frees lands directly in the heap — paid for with lower WiFi throughput
  ; during transfers (occasional sync/OTA use, not streaming: acceptable).
  ; IRAM cost is static, so the heap gain applies even with WiFi off.
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  ; Keep the Arduino wrappers for the removed cloud components (below) out of
  ; the core source list; all other bundled libraries default to enabled.
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  ; ESP_SR (speech recognition) only exists in the S3 core; its wrapper includes
  ; ESP_I2S.h, which the isolated core rebuild can't resolve. Unused here anyway,
  ; so drop it or the sticky env fails to build.
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
  ; X3 post-WiFi MaxAlloc is often ~32KB. Stock mbedTLS uses 16KB in + 16KB out
  ; (~32KB peak) so mbedtls_ssl_setup fails with -0x7F00 / ESP_ERR_HTTP_CONNECT
  ; (crosspoint-reader#2018). Asymmetric 16K in / 4K out keeps GitHub CDN
  ; handshakes reliable (8K in broke release-assets.githubusercontent.com cert
  ; verify) while cutting ~12KB off the TLS peak vs stock.
  CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
  CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
  CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
  ; =n (not "# ... is not set"): PlatformIO's INI parser strips '#' comment lines.
  ; Drops retained peer DER so X3 CDN RSA verify has MPI headroom (else 0x4290).
  CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE=n
  ; Allow omitting crt_bundle_attach for GitHub font/OTA GETs. X3 OOMs in RSA
  ; verify (0x4290 MPI_ALLOC_FAILED) on release-assets CDN; GitHub refuses plain
  ; http. Fonts still CRC32-check; other HTTPS keeps the CA bundle attached.
  CONFIG_ESP_TLS_INSECURE=y
  CONFIG_ESP_TLS_SKIP_SERVER_CERT_VERIFY=y
  ; mbedTLS holds the 16K in / 4K out buffers for the whole session, which on X3
  ; left ~9KB Free / ~5KB MaxAlloc mid-download — not enough for a 2KB read
  ; buffer or SD writes. Dynamic buffers allocate RX/TX per record and free them
  ; between reads; FREE_CONFIG_DATA/CA_CERT drop cert+DHM state after the
  ; handshake. Safe here: every hop builds a fresh client, so nothing re-uses a
  ; session whose certs were freed. DTLS must be off for dynamic buffers, and
  ; nothing in this firmware speaks DTLS.
  CONFIG_MBEDTLS_SSL_PROTO_DTLS=n
  CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
  CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA=y
  CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT=y

; Drop unused cloud components from the core rebuild. esp_insights/rainmaker
; require embedded server certs the lib builder can't generate
; ("https_server.crt.S not found"); this firmware uses none of them.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_schedule
  espressif/esp_rcp_update
  espressif/esp_secure_cert_mgr
  espressif/cbor

extra_scripts =
  pre:scripts/patch_wolfssl.py
  pre:scripts/copy_upstream_mbedtls.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  knolleary/PubSubClient @ ^2.8
  wolfssl/Arduino-wolfSSL @ 5.7.2

lib_ignore =
  BLE

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds


[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; Traditional Chinese release (zh-TW): ENABLE_CHINESE_VERSION + TC UI/fonts.
; Built-in CJK fonts cover the top 3500 most-common modern Chinese characters
; (Traditionalized) at 8/10/12/14pt, plus an i18n-only subset at 16pt/18pt.
; LTO on every CJK env (~186KB of flash, 96.1% -> 93.2% of the app slot), via
; `build_unflags -fno-lto` and nothing else. Do NOT also put -flto=auto in
; build_flags: the platform reacts to -fno-lto being unflagged by injecting
; -flto=auto into CC/C/CXXFLAGS and -flto into LINKFLAGS of the framework's
; pioarduino-build.py, and it does that only in the Arduino pass. build_flags,
; by contrast, apply to every pass — including the hybrid ESP-IDF pass that
; custom_sdkconfig triggers, whose dummy main component then compiles to slim
; LTO objects ('multiple common of __gnu_lto_slim' on .dummy/sketch.cpp.o) and
; is linked by a command with no LTO plugin loaded ('plugin needed to handle
; lto object'). The `undefined reference to end` / missing call_start_cpu0 this
; used to be blamed on were downstream symptoms: slim LTO objects carry no
; machine code.
[env:gh_release_tc]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-tc\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DENABLE_CHINESE_VERSION
  -DENABLE_CJK_VERSION
build_unflags =
  ${base.build_unflags}
  -fno-lto
build_src_filter =
  ${base.build_src_filter}
  +<activities/apps/weread/>

; Traditional Chinese nightly / RC (CROSSPOINT_RC_HASH from nightly workflow).
[env:gh_release_tc_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-tc-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DENABLE_CHINESE_VERSION
  -DENABLE_CJK_VERSION
build_unflags =
  ${base.build_unflags}
  -fno-lto
build_src_filter =
  ${base.build_src_filter}
  +<activities/apps/weread/>

; Simplified Chinese release (zh-CN): maps upstream gh_release_cn onto SC.
; Same CJK gates as TC, plus CHINESE_UI_SIMPLIFIED (SC UI strings via gen_i18n
; t2s, SC fonts, Tc→Sc remap). WeRead (incl. offline cache sources) included.
[env:gh_release_sc]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-sc\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DENABLE_CHINESE_VERSION
  -DENABLE_CJK_VERSION
  -DCHINESE_UI_SIMPLIFIED
build_unflags =
  ${base.build_unflags}
  -fno-lto
build_src_filter =
  ${base.build_src_filter}
  +<activities/apps/weread/>

; Simplified Chinese nightly / RC.
[env:gh_release_sc_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-sc-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DENABLE_CHINESE_VERSION
  -DENABLE_CJK_VERSION
  -DCHINESE_UI_SIMPLIFIED
build_unflags =
  ${base.build_unflags}
  -fno-lto
build_src_filter =
  ${base.build_src_filter}
  +<activities/apps/weread/>

; Japanese release (ja-JP): GenSen Rounded 2 JP fonts, EN+JA i18n.
; Char coverage: 教育漢字 (+kana) at 8/10/12pt, 常用漢字 at 14pt, i18n at 16/18pt.
; No OpenCC Han conversion — Japanese orthography stored as-is.
; WeRead stays excluded (ENABLE_CHINESE_VERSION only).
[env:gh_release_ja]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-ja\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DENABLE_JAPANESE_VERSION
  -DENABLE_CJK_VERSION
build_unflags =
  ${base.build_unflags}
  -fno-lto

; Japanese nightly / RC.
[env:gh_release_ja_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-ja-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DENABLE_JAPANESE_VERSION
  -DENABLE_CJK_VERSION
build_unflags =
  ${base.build_unflags}
  -fno-lto

; Korean release (ko-KR): Resource Han Rounded KR fonts, EN+KO i18n.
; Char coverage: all modern Hangul (11 172) + 기초 한자 1800 at 14pt only
; (no obsolete Hangul jamo); KS X 1001 at 8/10/12pt for list titles; i18n-only at
; 16/18pt so the OTA slot fits.
; korean.yaml force-included at every size. No OpenCC Han conversion.
; WeRead stays excluded (ENABLE_CHINESE_VERSION only).
[env:gh_release_ko]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-ko\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DENABLE_KOREAN_VERSION
  -DENABLE_CJK_VERSION
build_unflags =
  ${base.build_unflags}
  -fno-lto

; Korean nightly / RC.
[env:gh_release_ko_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-ko-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DENABLE_KOREAN_VERSION
  -DENABLE_CJK_VERSION
build_unflags =
  ${base.build_unflags}
  -fno-lto

; --- Seeed Sticky — ESP32-S3R8, 3.97" 800x480 SSD1677 + GT911 touch -----------
; Different MCU family than the C3 envs (one binary per family). The SDK
; auto-enables CAP_TOUCH (GT911) and the BQ27220 gauge for this device; PSRAM is
; intentionally left off (48KB framebuffer fits in DRAM, same as X4).
;   pio run -e sticky -t upload
[env:sticky]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  ; git_branch.py only injects CROSSPOINT_VERSION for the default env; set it here.
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-sticky\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
