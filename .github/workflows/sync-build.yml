name: Sync PR build verify

# Gate every upstream-sync PR with the release env set (gh_release +
# gh_release_tc + gh_release_sc). Lives next to sync-upstream.yml (merge orchestration)
# but kept as its own file so the two concerns don't entangle:
#   sync-upstream.yml -> maintain the standing chore/sync-upstream PR
#   sync-build.yml    -> "would this PR actually ship?" build check
# ci.yml already covers default-env build + cppcheck + clang-format on
# every PR. This workflow is the release-env top-up that only the sync
# branch needs, so the `if:` below scopes it strictly to chore/sync-upstream.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: ['codex/sync-upstream-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select_runner:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/sync-upstream-')) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/sync-upstream-'))
    uses: ./.github/workflows/select-build-runner.yml
    secrets:
      runner_status_token: ${{ secrets.H2O_RUNNER_TOKEN }}

  build:
    needs: select_runner
    runs-on: ${{ fromJSON(needs.select_runner.outputs['runs-on']) }}
    steps:
      - name: Isolate PlatformIO toolchains
        run: echo "PLATFORMIO_CORE_DIR=$RUNNER_TEMP/.platformio-$GITHUB_RUN_ID-$GITHUB_JOB" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.2.0

      - name: Prepare platform tools
        run: python scripts/patch_pioarduino_cache.py --prepare-platform

      # OpenCC tw2sp synthesizes ZH_CN UI strings for gh_release_sc (gen_i18n.py).
      - name: Install OpenCC
        run: uv pip install --system OpenCC

      - name: Cache PlatformIO packages
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ${{ env.PLATFORMIO_CORE_DIR }}/.cache
          key: pio-cache-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-cache-${{ runner.os }}-

      - name: Build gh_release + TC/SC/JA/KO
        run: |
          set -euo pipefail
          pio run -e gh_release -e gh_release_tc -e gh_release_sc -e gh_release_ja -e gh_release_ko
